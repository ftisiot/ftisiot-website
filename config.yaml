theme: "gohugo-theme-ananke"
baseURL: "https://ftisiot.net"
languageCode : "en-us"
title: "Data and Open Source"
googleAnalytics: "G-7Z74BTZ0TM"
pygmentsStyle: pygments

# SEO Meta Tags
meta_description: "Francesco Tisiot's tech blog covering PostgreSQL, MySQL, Apache Kafka, data engineering, and more. Expert insights on database optimization, streaming data, and modern data platforms."
meta_keywords: "PostgreSQL, MySQL, Apache Kafka, data engineering, database optimization, streaming data, data platforms, tech blog, Francesco Tisiot"

# Sitemap Configuration
sitemap:
  changefreq: monthly
  priority: 0.5
  filename: sitemap.xml

# Robots.txt
enableRobotsTXT: true


params:
  ananke_socials:
  - name: twitter
    url: https://twitter.com/FTisiot
  - name: github
    url: https://github.com/ftisiot
  - name: linkedin
    url: https://www.linkedin.com/in/francescotisiot/
  - name: youtube
    url: https://www.youtube.com/channel/UCTJ4oA3-T3RdmM2OJ7d8cJg
  - name: mastodon
    url: https://hachyderm.io/@ftisiot
  AuthorName: Francesco Tisiot
  GitHubUser: "ftisiot"
  image: "images/ftisiot.jpg"
  enableEmoji: true
  GoogleAnalyticsID: "G-7Z74BTZ0TM"
  
  # Open Graph
  og_image: "https://ftisiot.net/images/ftisiot.jpg"
  og_type: "website"
  og_site_name: "ftisiot.net"
  
  # Twitter Card
  twitter_card: "summary_large_image"
  twitter_creator: "@FTisiot"
  twitter_site: "@FTisiot"
  
  # Additional SEO
  description: "Francesco Tisiot's blog covering PostgreSQL, MySQL, Apache Kafka, data engineering, and more. Insights on db optimization, streaming, and modern data platforms"
  
  # Additional SEO
  enableSchema: true
  enableSearch: true
  enableRelatedContent: true

permalinks:
  post: /:year/:month/:day/:title/

taxonomies:
  category: categories
  tag: tag

outputs:
   home:
      - HTML
      - JSON
      - RSS
   page:
      - HTML
   section:
      - HTML
      - RSS
   taxonomy:
      - HTML
      - RSS

menu:
  main:
  - name: about
    title: who
    url: /who/
    weight: -10
  - name: suggestions
    title: suggestions
    url: /suggestions-verona/
    weight: -8
  - name: json-pg
    title: json-pg
    url: /postgresqljson/main/
    weight: -6
  - name: json-mysql
    title: json-mysql
    url: /mysqljson/main/
    weight: -5
  - name: slides
    title: slides
    url: /slides/
    weight: -4

markup:
  asciidocExt:
    attributes: {allow-uri-read}
    safeMode: unsafe
    enableEmoji: true
  goldmark:
    renderer:
      unsafe: true
